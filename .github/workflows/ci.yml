name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend lint and type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy app

  backend-tests:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_DB: careerrank_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d careerrank_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: test
      APP_URL: http://localhost:3000
      API_URL: http://localhost:8000
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/careerrank_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/careerrank_test
      REDIS_URL: redis://localhost:6379/0
      JWT_ISSUER: careerrank-api
      JWT_AUDIENCE: careerrank-web
      JWT_ACCESS_TTL_MINUTES: 30
      JWT_REFRESH_TTL_DAYS: 14
      COOKIE_SECURE: false
      CORS_ORIGINS: '["http://localhost:3000"]'
      REQUIRE_INTEGRATION_TESTS: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Generate ephemeral JWT secret
        shell: bash
        run: echo "JWT_SECRET=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"
      - name: Apply migrations
        run: alembic upgrade head
      - name: Require one migration head
        shell: bash
        run: test "$(alembic heads | grep -c '(head)')" -eq 1
      - name: Check migration drift
        run: alembic check
      - name: Run tests
        run: pytest

  frontend:
    name: Frontend lint, type check, tests, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: apps/web
        run: pnpm lint
      - name: Type check
        working-directory: apps/web
        run: pnpm typecheck
      - name: Test
        working-directory: apps/web
        run: pnpm test
      - name: Build
        working-directory: apps/web
        run: pnpm build

  dependency-security:
    name: Dependency security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt
      - name: Install backend and audit dependencies
        working-directory: apps/api
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m pip install bandit pip-audit
      - name: Scan backend source with Bandit
        working-directory: apps/api
        run: bandit -q -r app
      - name: Audit Python dependencies
        working-directory: apps/api
        run: python -m pip_audit --requirement requirements.txt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production JavaScript dependencies
        run: pnpm audit --prod --audit-level high

  images:
    name: Build container images
    runs-on: ubuntu-latest
    needs:
      - backend-quality
      - backend-tests
      - frontend
      - dependency-security
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-compose-password
          JWT_SECRET: ci-only-compose-jwt-secret-with-at-least-32-characters
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          load: true
          tags: careerrank-api:ci
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: careerrank-web:ci
          build-args: |
            API_URL=http://api:8000
      - name: Smoke test API image import
        run: >-
          docker run --rm
          -e DATABASE_URL=postgresql+psycopg://ci:ci@database.invalid:5432/careerrank
          -e JWT_SECRET=ci-only-image-secret-with-at-least-32-characters
          careerrank-api:ci
          python -c "from app.main import app; assert app.title == 'CareerRank API'"
      - name: Smoke test web image startup
        shell: bash
        run: |
          container_id="$(docker run --detach --publish 3000:3000 careerrank-web:ci)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1
